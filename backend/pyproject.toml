[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120.0",
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "pydantic-settings>=2.11.0",
    "structlog>=26.1.0",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
